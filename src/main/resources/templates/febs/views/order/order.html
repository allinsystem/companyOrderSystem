<style>
    #febs-order xm-select {
        min-height: 30px;
        line-height: 30px;
    }

    #febs-order xm-select > .xm-label .scroll .label-content {
        display: flex;
        padding: 0 30px 0 10px;
    }
</style>
<div class="layui-fluid layui-anim febs-anim" id="febs-order" lay-title="発注管理">
    <div class="layui-row febs-container">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body febs-table-full">
                    <form class="layui-form layui-table-form" lay-filter="data-table-form">
                        <div class="layui-row">
                            <div class="layui-col-md10">
                                <div class="layui-form-item">
                                    <div class="layui-inline">
                                        <div class="layui-input-inline">
                                            <input type="radio" name="form-selection" filter="form-selection" value="1" title="発注書"
                                                   class="layui-input">
                                            <input type="radio" name="form-selection" filter="form-selection" checked="checked" value="0" title="請求書"
                                                   class="layui-input">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="layui-row">
                            <div class="layui-col-md10">
                                <div class="layui-form-item">
                                    <div class="layui-inline">
                                        <label class="layui-form-label layui-form-label-sm">会社名</label>
                                        <div class="layui-input-inline">
                                            <input type="text" name="customer" autoComplete="off"
                                                   class="layui-input">
                                        </div>
                                    </div>
                                    <div class="layui-inline" id="dateSeletor">
                                        <label class="layui-form-label layui-form-label-sm">作成期間</label>
                                        <div class="layui-input-inline">
                                            <input type="text" name="dateFrom" autoComplete="off" id="dateFrom" class="layui-input"
                                                   placeholder="作成開始日">
                                        </div>
                                        <div class="layui-form-mid">-</div>
                                        <div class="layui-input-inline">
                                            <input type="text" name="dateTo" autoComplete="off" id="dateTo" class="layui-input"
                                                   placeholder="作成終了日">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-col-md2 layui-col-sm12 layui-col-xs12 table-action-area">
                                <div class="layui-btn layui-btn-sm layui-btn-primary febs-button-blue-plain table-action"
                                     id="query">
                                    <i class="layui-icon">&#xe848;</i>
                                </div>
                                <div class="layui-btn layui-btn-sm layui-btn-primary febs-button-green-plain table-action"
                                     id="reset">
                                    <i class="layui-icon">&#xe79b;</i>
                                </div>
                                <div class="layui-btn layui-btn-sm layui-btn-primary table-action action-more">
                                    <i class="layui-icon">&#xe875;</i>
                                </div>
                            </div>
                        </div>
                    </form>
                    <table lay-filter="dataTable" lay-data="{id: 'dataTable'}"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/html" id="data-option">
    <a lay-event="detail"><i
            class="layui-icon febs-edit-area febs-green">&#xe7a5;</i></a>
    <a lay-event="edit"><i
            class="layui-icon febs-edit-area febs-blue">&#xe7a4;</i></a>
    <a lay-event="del"><i 
            class="layui-icon febs-edit-area febs-red">&#xe7f9;</i></a>
    <a lay-event="exprot"><i 
            class="layui-icon febs-edit-area febs-gray">&#xe67d;</i></a>
</script>
<script data-th-inline="none" type="text/javascript">
    layui.use(['dropdownMenu', 'jquery', 'laydate', 'form', 'table', 'febs', 'xmSelect'], function () {
        let $ = layui.jquery,
            laydate = layui.laydate,
            febs = layui.febs,
            form = layui.form,
            table = layui.table,
            dropdownMenu = layui.dropdownMenu,
            $view = $('#febs-order'),
            $query = $view.find('#query'),
            $reset = $view.find('#reset'),
            $searchForm = $view.find('form'),
            sortObject = {field: 'invoiceDate', type: null},
            tableIns,
            createTimeFrom,
            createTimeTo,
            formName = 'invoice';


        form.on("radio(form-selection)",function(data){
            if(data.value === '0'){
                formName = 'invoice';
            }else{
                formName = 'order';
            }
            sortObject = {field: formName +'Date', type: null}
            initTable();
        });

        form.render();

        initTable();
        
        laydate.render({
            elem: '#dateSeletor',
            range: ['#dateFrom', '#dateTo']
        });

        dropdownMenu.render({
            elem: $view.find('.action-more'),
            click: function (name, elem, event) {
                let checkStatus = table.checkStatus('dataTable');
                if (name === 'add') {
                    febs.modal.open('請求書・発注書作成', formName+'/add', {
                        btn: ['登録', 'リセット'],
                        area: $(window).width() <= 750 ? '95%' : '50%',
                        yes: function (index, layero) {
                            $('#data-add').find('#submit').trigger('click');
                        },
                        btn2: function () {
                            $('#data-add').find('#reset').trigger('click');
                            return false;
                        }
                    });
                }
                if (name === 'delete') {
                    if (!checkStatus.data.length) {
                        febs.alert.warn('削除する請求書・発注書にチェックを入れてください');
                    } else {
                        febs.modal.confirm('請求書・発注書削除', '選択された請求書・発注書を削除してよろしいでしょうか', function () {
                            let invoiceIds = [];
                            layui.each(checkStatus.data, function (key, item) {
                                invoiceIds.push(item.inoviceId)
                            });
                            deleteInvoice(invoiceIds.join(','));
                        });
                    }
                }
                if (name === 'export') {
                    let params = $.extend(getQueryParams(), {field: sortObject.field, order: sortObject.type});
                    params.pageSize = $view.find(".layui-laypage-limits option:selected").val();
                    params.pageNum = $view.find(".layui-laypage-em").next().html();
                    febs.download(ctx + formName+'/excel', params, formName+'_template.xlsx');
                }
            },
            options: [{
                name: 'add',
                title: '請求書・発注書作成',
                perms: formName+':add'
            }, {
                name: 'delete',
                title: '請求書・発注書削除',
                perms: formName+':delete'
            }, {
                name: 'export',
                title: 'エクセル出力',
                perms: formName+':export'
            }]
        });
        table.on('tool(dataTable)', function (obj) {
            let data = obj.data,
                layEvent = obj.event;
            if (layEvent === 'detail') {
                febs.modal.view('請求書・発注書', 'order/' + formName + '/detail/' + data.id, {
                    area: $(window).width() <= 750 ? '95%' : '660px'
                });
            }
            if (layEvent === 'del') {
                febs.modal.confirm('請求書・発注書の削除', '請求書・発注書を削除してよろしいでしょうか。', function () {
                    deleteInvoice(data.Id);
                });
            }
            if (layEvent === 'edit') {
                febs.modal.open('請求書・発注書の編集', 'order/' +formName + '/update/' + data.id, {
                    area: $(window).width() <= 750 ? '90%' : '50%',
                    btn: ['確定', '取消'],
                    yes: function (index, layero) {
                        $('#invoice-update').find('#submit').trigger('click');
                    },
                    btn2: function () {
                        layer.closeAll();
                    }
                });
            }
            if (layEvent === 'export') {
                ebs.modal.confirm('請求書・発注書の削除', '請求書・発注書を削除してよろしいでしょうか。', function () {
                    deleteInvoice(data.Id);
                });
            }
        });

        table.on('sort(invoiceTable)', function (obj) {
            sortObject = obj;
            tableIns.reload({
                initSort: obj,
                where: $.extend(getQueryParams(), {
                    field: obj.field,
                    order: obj.type
                })
            });
        });

        $query.on('click', function () {
            let params = $.extend(getQueryParams(), {field: sortObject.field, order: sortObject.type});
            tableIns.reload({where: params, page: {curr: 1}});
        });

        $reset.on('click', function () {
            $searchForm[0].reset();
            sortObject.type = 'null';
            createTimeTo = null;
            createTimeFrom = null;
            tableIns.reload({where: getQueryParams(), page: {curr: 1}, initSort: sortObject});
        });

        function initTable() {
            if(formName === 'invoice') {
                tableIns = febs.table.init({
                    elem: $view.find('table'),
                    id: 'dataTable',
                    url: ctx + formName+'/list',
                    cols: [[
                        {type: 'checkbox'},
                        {field: 'id', title: '', minWidth: 0},
                        {field: 'invoiceDate', title: '作成日時', minWidth: 180, sort: true},
                        {field: 'customerName', title: '会社名', minWidth: 100},
                        {field: 'employeeName', title: '従業員名', minWidth: 100},
                        {field: 'projectName', title: 'プロジェクト', minWidth: 100},
                        {field: 'count', title: '数量', minWidth: 100},
                        {field: 'price', title: '単価', minWidth: 100},
                        {title: '', toolbar: '#data-option', minWidth: 140}
                    ]]
                });
            }else{
                tableIns = febs.table.init({
                    elem: $view.find('table'),
                    id: 'dataTable',
                    url: ctx + formName+'/list',
                    cols: [[
                        {type: 'checkbox'},
                        {field: 'id', title: '', minWidth: 0},
                        {field: 'orderDate', title: '作成日時', minWidth: 180, sort: true},
                        {field: 'customerName', title: '会社名', minWidth: 100},
                        {field: 'employeeName', title: '従業員名', minWidth: 100},
                        {field: 'projectName', title: 'プロジェクト', minWidth: 100},
                        {field: 'minTime', title: '下限時間', minWidth: 100},
                        {field: 'maxTime', title: '上限時間', minWidth: 100},
                        {field: 'count', title: '数量', minWidth: 100},
                        {field: 'price', title: '単価', minWidth: 100},
                        {title: '', toolbar: '#data-option', minWidth: 140}
                    ]]
                });
            }
        }

        function getQueryParams() {
            let params = $searchForm.serializeJson();
            params.customer
            params.invalidate_ie_cache = new Date();
            params.dateFrom = dateFrom;
            params.dateTo = dateTo;
            return params;
        }

        function deleteInvoice(id) {
            febs.get(ctx + formName+'/delete/' + id, null, function () {
                febs.alert.success('削除成功');
                $query.click();
            });
        }
    })
</script>
