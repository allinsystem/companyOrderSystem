<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
	<div class="container" id="febs-order-detail">



		<div>
			<span class="layui-icon layui-icon-user"></span>名前：
			[[${orderDetail.customerName}]]
		</div>



		<div>
			<span class="layui-icon layui-icon-time"></span>請求日：

			[[${invoiceDate}]]

		</div>


		<div>
			<span class="layui-icon layui-icon-user"></span>作業者名：[[${orderDetail.employeeName}]]
		</div>



		<div>
			<span class="layui-icon layui-icon-read"></span>作業名：
			[[${orderDetail.projectName}]]
		</div>



		<div>
			<span class="layui-icon layui-icon-form"></span>数量：[[${orderDetail.count}]]
		</div>



		<div>
			<span class="layui-icon layui-icon-rmb"></span>単価：[[${orderDetail.price}]]
		</div>


	</div>
